<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>SAKURAの時間貯金箱</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@600&display=swap" rel="stylesheet">
  <style>
    /* === ここにCSS（前回と同じ） === */
  </style>
</head>
<body>
  <header>
    <h1><span class="sakura">SAKURA</span>の時間貯金箱</h1>
    <button class="btn small settingsBtn" id="openSettings">⚙️ 設定</button>
    <div class="rule-box">
      ✨時間がたまるルール✨<br>
      プリント1まいは15分のきまり。<br>
      15分よりはやくできた分の時間が「ごほうびの時間」としてたまるよ！<br>
      がんばってたくさんのプリントをすればするほど、じかんもいっぱいたまるよ！
    </div>
    <div class="totalWrap">
      <div class="mascot" id="mascot"><span>🐰</span></div>
      <div>
        <div class="total" id="totalMinutes">0分</div>
        <div class="totalLabel">いままでためた時間</div>
      </div>
    </div>
  </header>

  <main>
    <div class="controls">
      <div class="box">
        <h4>今日の貯金</h4>
        <div class="grid2">
          <div>
            <label>何枚やった？</label>
            <input id="sheetCount" type="number" min="1" step="1" value="1">
            <div class="previewUnder" id="previewBase">15 × 1 = 15分</div>
          </div>
          <div>
            <label>何分かかった？</label>
            <input id="spentMin" type="number" min="0" step="1" placeholder="合計の分数">
          </div>
          <div class="actionRow">
            <div class="previewInline" id="previewSave">今日の貯金：+15分</div>
            <button class="btn save" id="saveBtn">貯金</button>
          </div>
        </div>
      </div>
      <div class="box">
        <h4>時間を使う</h4>
        <label>何分つかう？</label>
        <input id="useMin" type="number" min="1" step="1" placeholder="使う分数">
        <div style="text-align:right; margin-top:8px;">
          <button class="btn spend" id="spendBtn">使う</button>
        </div>
      </div>
    </div>

    <div class="selectedLabel" id="selectedLabel">日付をカレンダーから選んでね</div>
    <div class="calWrap">
      <div class="monthBar">
        <div class="title" id="monthLabel"></div>
        <div class="nav">
          <button id="prevMonth">←</button>
          <button id="nextMonth">→</button>
        </div>
      </div>
      <div class="calendar" id="calendar"></div>
      <div class="foot">※ この端末内に保存されます（外部送信なし）</div>
    </div>
  </main>

  <div class="modal" id="settingsModal" aria-hidden="true">
    <div class="inner">
      <h3>キャラクター設定（貯金ごとに9キャラ順番に変化）</h3>
      <p class="hint">画像はこの端末のブラウザに保存されます</p>
      <div class="uploader" id="uploader"></div>
      <div class="row">
        <div class="hint">現在の順番：<span id="orderHint">1</span> / 9</div>
        <div>
          <button class="btn small" id="resetCycle">順番リセット</button>
          <button class="btn small" id="clearMascots">画像クリア</button>
          <button class="btn small" id="closeSettings">閉じる</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* === ここにJavaScript（前回と同じ） === */
  </script>
</body>
</html>
  <script>
    function dateStrLocal(d){ const y=d.getFullYear(), m=('0'+(d.getMonth()+1)).slice(-2), day=('0'+d.getDate()).slice(-2); return `${y}-${m}-${day}`; }

    const KEY='timebank_v7';
    const MASCOT9_KEY='timebank_mascots9_v1';
    const CYCLE_KEY='timebank_cycle_idx_v1'; // 0..8

    const state = JSON.parse(localStorage.getItem(KEY) || '{"byDate":{}}');
    function persist(){ localStorage.setItem(KEY, JSON.stringify(state)); renderAll(); }

    let mascots9 = JSON.parse(localStorage.getItem(MASCOT9_KEY) || '["","","","","","","","",""]');
    function persistMascots(){ localStorage.setItem(MASCOT9_KEY, JSON.stringify(mascots9)); renderAll(); }
    let cycleIdx = parseInt(localStorage.getItem(CYCLE_KEY)||'0',10) || 0;

    let viewMonth = new Date();
    let selectedDate = dateStrLocal(new Date());
    const sheetCount = document.getElementById('sheetCount');
    const spentMin = document.getElementById('spentMin');
    const useMin = document.getElementById('useMin');
    const previewBase = document.getElementById('previewBase');
    const previewSave = document.getElementById('previewSave');
    const selectedLabel = document.getElementById('selectedLabel');
    const totalMinutesEl = document.getElementById('totalMinutes');
    const mascotEl = document.getElementById('mascot');
    const orderHint = document.getElementById('orderHint');

    const fallback9 = ['🐰','🐱','🦄','🐻','🐼','🐨','🐯','🐸','👑'];

    function computeSaved(){ const cnt=Math.max(1,parseInt(sheetCount.value||'1',10)); const spent=Math.max(0,parseInt(spentMin.value||'0',10)); return Math.max(0, 15*cnt - spent); }
    function updateBasePreview(){ const cnt=Math.max(1,parseInt(sheetCount.value||'1',10)); previewBase.textContent=`15 × ${cnt} = ${15*cnt}分`; }
    function updateSavePreview(){ previewSave.textContent=`今日の貯金：+${computeSaved()}分`; }
    sheetCount.addEventListener('input', ()=>{ updateBasePreview(); updateSavePreview(); });
    spentMin.addEventListener('input', updateSavePreview);
    updateBasePreview(); updateSavePreview();

    function totalBalance(){ let s=0, b=state.byDate||{}; for(const k in b){ s += (b[k].save||0)-(b[k].spend||0);} return s; }

    function updateMascotByCycle(){
      const idx = (cycleIdx + 8) % 9; 
      const url = mascots9[idx];
      mascotEl.innerHTML = url ? `<img src="${url}" alt="mascot">` : fallback9[idx];
      orderHint.textContent = (cycleIdx % 9) + 1;
    }

    function sparkle(){
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type='triangle'; osc.frequency.setValueAtTime(880, now); osc.frequency.exponentialRampToValueAtTime(1760, now+0.18);
      gain.gain.setValueAtTime(0.0001, now); gain.gain.exponentialRampToValueAtTime(0.08, now+0.02); gain.gain.exponentialRampToValueAtTime(0.0001, now+0.22);
      osc.connect(gain).connect(ctx.destination); osc.start(now); osc.stop(now+0.25);
    }

    function setRecord(dateStr,type,minutes){ if(!state.byDate[dateStr]) state.byDate[dateStr]={save:0,spend:0}; state.byDate[dateStr][type]=Math.max(0, Math.floor(Number(minutes)||0)); persist(); }

    document.getElementById('saveBtn').onclick = ()=>{
      const saved=computeSaved(); setRecord(selectedDate,'save',saved); sparkle();
      const used = cycleIdx;
      const url = mascots9[used];
      mascotEl.innerHTML = url ? `<img src="${url}" alt="mascot">` : fallback9[used];
      mascotEl.style.transform='scale(1.12)'; setTimeout(()=> mascotEl.style.transform='', 220);
      cycleIdx = (cycleIdx + 1) % 9;
      localStorage.setItem(CYCLE_KEY, String(cycleIdx));
      orderHint.textContent = (cycleIdx % 9) + 1;
    };

    document.getElementById('spendBtn').onclick = ()=>{
      const mins=Math.max(1,parseInt(useMin.value||'1',10)); setRecord(selectedDate,'spend',mins);
    };

    const calEl=document.getElementById('calendar'); const monthLabel=document.getElementById('monthLabel');
    function renderCalendar(){
      const y=viewMonth.getFullYear(), m=viewMonth.getMonth();
      monthLabel.textContent=`${y}年 ${m+1}月`; calEl.innerHTML='';
      ['日','月','火','水','木','金','土'].forEach(d=>{ const h=document.createElement('div'); h.className='dow'; h.textContent=d; calEl.appendChild(h); });
      const start=new Date(y,m,1), end=new Date(y,m+1,0); const startDow=start.getDay();
      for(let i=0;i<startDow;i++){ calEl.appendChild(document.createElement('div')); }
      for(let i=1;i<=end.getDate();i++){
        const d=new Date(y,m,i); const ds=dateStrLocal(d);
        const cell=document.createElement('div'); cell.className='day'; if(ds===selectedDate) cell.classList.add('selected');
        const num=document.createElement('div'); num.className='num'; num.textContent=i;
        const rec=document.createElement('div'); rec.className='rec';
        const r=state.byDate[ds]; const parts=[]; if(r){ if(r.save>0) parts.push(`<span class="plus">+${r.save}分</span>`); if(r.spend>0) parts.push(`<span class="minus">-${r.spend}分</span>`); }
        rec.innerHTML=parts.join(' ');
        cell.appendChild(num); cell.appendChild(rec);
        cell.addEventListener('click', ()=>{ selectedDate=ds; renderCalendar(); selectedLabel.textContent=`選択中の日付：${ds}`; });
        calEl.appendChild(cell);
      }
    }
    document.getElementById('prevMonth').onclick = ()=>{ viewMonth.setMonth(viewMonth.getMonth()-1); renderCalendar(); };
    document.getElementById('nextMonth').onclick = ()=>{ viewMonth.setMonth(viewMonth.getMonth()+1); renderCalendar(); };

    function renderAll(){
      totalMinutesEl.textContent = totalBalance() + '分';
      selectedLabel.textContent = selectedDate? `選択中の日付：${selectedDate}`:'日付をカレンダーから選んでね';
      renderCalendar(); updateBasePreview(); updateSavePreview(); updateMascotByCycle();
    }
    renderAll();

    const modal = document.getElementById('settingsModal');
    const openBtn = document.getElementById('openSettings');
    const closeBtn = document.getElementById('closeSettings');
    const clearBtn = document.getElementById('clearMascots');
    const resetBtn = document.getElementById('resetCycle');
    const uploader = document.getElementById('uploader');

    function buildSlots(){
      uploader.innerHTML = '';
      for(let i=0;i<9;i++){
        const slot = document.createElement('div'); slot.className='slot';
        slot.innerHTML = `
          <h5>${i+1}番（順番）</h5>
          <div class="thumb" id="thumb${i}">${mascots9[i] ? `<img src="${mascots9[i]}" alt="m${i}">` : '<span>＋</span>'}</div>
          <input id="file${i}" type="file" accept="image/*">
        `;
        uploader.appendChild(slot);
      }
      for(let i=0;i<9;i++){
        const inp = document.getElementById('file'+i);
        inp.addEventListener('change', ()=>{
          const file = inp.files && inp.files[0]; if(!file) return;
          const reader = new FileReader();
          reader.onload = e => { mascots9[i]=e.target.result; persistMascots(); buildSlots(); };
          reader.readAsDataURL(file);
        });
      }
    }
    buildSlots();

    openBtn.onclick = ()=>{ modal.style.display='flex'; modal.setAttribute('aria-hidden','false'); };
    closeBtn.onclick = ()=>{ modal.style.display='none'; modal.setAttribute('aria-hidden','true'); };
    modal.addEventListener('click', (e)=>{ if(e.target===modal){ closeBtn.click(); }});
    clearBtn.onclick = ()=>{ mascots9 = ["","","","","","","","",""]; persistMascots(); buildSlots(); };
    resetBtn.onclick = ()=>{ cycleIdx = 0; localStorage.setItem(CYCLE_KEY, '0'); updateMascotByCycle(); };
  </script>
</body>
</html>
