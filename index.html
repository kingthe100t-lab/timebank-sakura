<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>SAKURAの時間貯金箱</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@600&display=swap" rel="stylesheet">
  <style>
    :root{--bg1:#dff6ff;--bg2:#fce4f7;--ink:#374151;--card:#fff;--ring:0 0 0 6px rgba(125,211,252,.35);--shadow:0 8px 24px rgba(0,0,0,.08);--accent:#0ea5e9}
    *{box-sizing:border-box} body{margin:0;font-family:'Baloo 2',system-ui,-apple-system,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink)}
    header{text-align:center;background:linear-gradient(135deg,#a6e3f5,#fcd6f6);padding:16px 14px 8px;border-radius:0 0 20px 20px;box-shadow:var(--shadow);position:relative}
    header h1{margin:0;font-size:clamp(24px,6vw,38px);color:#1e3a8a;letter-spacing:.5px;font-family:'Baloo 2',cursive;line-height:1.15}
    header h1 .sakura{font-family:'Pacifico',cursive;color:#ff6fa9;font-size:1.12em;letter-spacing:.02em}
    .rule-box{margin:8px auto 6px;background:#fffafc;border:2px dashed #ffb6d9;border-radius:14px;padding:8px 12px;max-width:980px;color:#444;font-size:clamp(14px,2.4vw,16px)}
    .totalWrap{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0}
    .mascot{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:42px;transition:transform .2s;border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow);border:2px solid #e5e7eb}
    .mascot img{width:100%;height:100%;object-fit:cover}
    .total{font-weight:900;font-size:clamp(26px,6.5vw,48px);color:var(--accent);text-shadow:0 2px 0 rgba(255,255,255,.6)}
    .totalLabel{font-size:clamp(13px,2.6vw,15px);color:#1f2937}
    main{max-width:1120px;margin:12px auto;padding:0 12px 18px}
    .controls{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:start;margin-bottom:10px}
    .box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:var(--shadow);padding:10px 12px}
    .box h4{margin:0 0 8px;font-size:16px;color:#1e40af}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
    label{font-size:14px;color:#374151;display:block;margin-bottom:4px}
    input[type="number"]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #e5e7eb;font-size:16px}
    .btn{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;box-shadow:var(--shadow);font-size:16px}
    .btn.save{background:#a7f3d0;color:#065f46}.btn.spend{background:#fecaca;color:#7f1d1d}.btn.small{font-size:14px;padding:6px 10px}
    .previewUnder{grid-column:1/2;margin-top:4px;color:#065f46;font-weight:800;text-align:left}
    .actionRow{grid-column:1/3;display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:4px}
    .previewInline{font-weight:900;color:#065f46;font-size:16px}
    .selectedLabel{text-align:center;margin:6px 0 10px;color:#6b7280;font-size:14px}
    .calWrap{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px}
    .monthBar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
    .monthBar .title{font-weight:800;color:#1e40af}
    .nav{display:flex;gap:8px}.nav button{padding:6px 10px;border-radius:10px;border:1px solid #e5e7eb;background:#f8fafc}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .dow{text-align:center;font-size:13px;color:#9ca3af;padding:6px 0}
    .day{position:relative;min-height:78px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;transition:box-shadow .2s,transform .05s;cursor:pointer}
    .day:hover{transform:translateY(-1px)}.day.selected{box-shadow:var(--ring)}
    .day .num{position:absolute;top:6px;left:8px;font-weight:800;color:#1f2937}
    .day .rec{font-size:14px;line-height:1.2;color:#374151;white-space:nowrap}
    .day .rec .plus{color:#065f46;background:#d1fae5;padding:2px 6px;border-radius:999px;margin-right:4px}
    .day .rec .minus{color:#7f1d1d;background:#fee2e2;padding:2px 6px;border-radius:999px}
    .foot{text-align:center;color:#9ca3af;margin-top:8px;font-size:12px}
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);padding:12px}
    .modal .inner{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:16px;box-shadow:var(--shadow)}
    .modal h3{margin:0 0 10px;color:#1e40af;font-size:18px}
    .uploader{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .slot{border:1px dashed #e5e7eb;border-radius:12px;padding:10px}
    .slot h5{margin:0 0 6px;font-size:14px;color:#374151}
    .slot .thumb{width:100%;height:96px;background:#f8fafc;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:6px;border:1px solid #e5e7eb}
    .slot .thumb img{width:100%;height:100%;object-fit:cover}
    .modal .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
    .hint{font-size:12px;color:#6b7280}
  </style>
</head>
<body>
  <header>
    <h1><span class="sakura">SAKURA</span>の時間貯金箱</h1>
    <button class="btn small" id="openSettings" style="position:absolute;right:10px;top:10px">⚙️ 設定</button>
    <div class="rule-box">✨時間がたまるルール✨<br>プリント1まいは15分のきまり。<br>15分よりはやくできた分の時間が「ごほうびの時間」としてたまるよ！<br>がんばってたくさんのプリントをすればするほど、じかんもいっぱいたまるよ！</div>
    <div class="totalWrap"><div class="mascot" id="mascot"><span>🐰</span></div><div><div class="total" id="totalMinutes">0分</div><div class="totalLabel">いままでためた時間</div></div></div>
  </header>
  <main><div class="controls">…</div></main>
  <script>
    // ここに前回のJavaScript全文が入ります（省略）
  </script>
</body>
</html>
